<div fxLayout="row">
  <h2>Editar Reserva</h2>
  <button mat-icon-button style="left: 80%;" mat-dialog-close="">
    <mat-icon>close</mat-icon>
  </button>
</div>
<mat-divider></mat-divider>
<br>

<mat-drawer-container style="height: 75%">
  <mat-drawer mode="side" opened >
    <div style="width: 250px">
      <form [formGroup]="formGroup">
        <mat-form-field appearance="fill" class="vertical-container">
          <mat-select [value]="selectedComplejo.nombre" disabled>
            <mat-option [value]="selectedComplejo.nombre">{{selectedComplejo.nombre}}</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field class="vertical-container">
          <mat-label>Cancha</mat-label>
          <mat-select [(ngModel)]="selectedCancha" formControlName="cancha" required>
            <mat-option *ngFor="let cancha of canchas" [value]="cancha">
              {{"Nro. " + cancha.numero + " - " + " " + cancha.tipo}}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field class="vertical-container">
          <mat-label>Fecha</mat-label>
          <input matInput [matDatepicker]="picker" [min]="minDate" [max]="maxDate" [(ngModel)]="selectedFecha"
                 formControlName="fecha" required>
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker disabled="false"></mat-datepicker>
          <!--  <input matInput placeholder="Ingrese un código" [formControl]="formCtrlFecha" required> -->
        </mat-form-field>
        <button mat-raised-button color="warn" class="vertical-container" (click)="setMostrarScheduler()"
                [disabled]="!formGroup.valid">
          <mat-icon>search</mat-icon>
          Consultar
        </button>
      </form>
    </div>
  </mat-drawer>

  <mat-drawer-content>
    <br>
    <!--[reservas]="reservas"-->
    <div *ngIf="mostrarScheduler">
      <app-scheduler [reservas]="reservas" [complejo]="selectedComplejo" [cancha]="selectedCancha"
                     [fecha]="selectedFecha" >
      </app-scheduler>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
<br>
<mat-hint style="color: #AB2A3E; text-align: justify">{{textoEdicion}}</mat-hint>
