<div flex fxLayout="row wrap" style="justify-content: center; margin-top: 50px">
  <mat-card class="complejo-card" *ngFor="let complejoConImg of listaComplejoConImg">
    <mat-card-header>
      <div mat-card-avatar>
        <img style="border-radius: 50%; height: 50px; width: 50px;"
             [src]="complejoConImg.logo">
      </div>
      <mat-card-title>&nbsp;&nbsp;{{complejoConImg.complejo.nombre}}</mat-card-title>
      <mat-card-subtitle>&nbsp;&nbsp;Dirección: {{complejoConImg.complejo.direccion}}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <mat-divider></mat-divider>
      <br>
      <div class="row">
        <div class="column">
          <img style="display: block; margin: auto; height: 200px; width: 200px;"
               [src]="complejoConImg.imagen">
        </div>
        <div class="column">
          <div style="margin-left: 5px">
            <h4><strong><span style="color: #1F8A4D">Teléfono:</span></strong> {{complejoConImg.complejo.telefono}}</h4>
            <h4><strong><span style="color: #1F8A4D">Correo: </span></strong> {{complejoConImg.complejo.correo}}</h4>
            <h4><strong><span style="color: #1F8A4D">Apertura: </span></strong> {{complejoConImg.complejo.apertura}}
            </h4>
            <h4><strong><span style="color: #1F8A4D">Cierre: </span></strong> {{complejoConImg.complejo.cierre}}</h4>
            <button mat-raised-button color="primary" (click)="verCanchas(complejoConImg.complejo.idComplejo)">Ver
              canchas
            </button>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
